<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Funcionario - Hospital de Clínicas</title>
    <link rel="stylesheet" href="../css/panel_fun.css">
</head>
<body>

    <header>
        <div class="logo-panel">
            <img src="../img/Logo_Hc_small.png" alt="Logo Hospital de Clínicas">
        </div>
        
        <div class="titulo-panel">
            <h1>Hospital de Clínicas</h1>
            <h2>Panel de Funcionario</h2>
        </div>

        <div class="perfil-header">
            <div class="perfil-texto">
                <strong id="nombre-usuario">Funcionario</strong>
                <span>Sesión Activa</span>
            </div>
        </div>
    </header>

    <main>
        <section class="panel-principal">
            <h2>Gestión del Sistema</h2>

            <div class="botones-panel">
                <a href="../php/funcionarios.php" class="boton-panel pos-1">
                    <span>Lista de Funcionarios</span>
                </a>

                <a href="registro.html" class="boton-panel pos-2">
                    <span>Registrar Funcionario</span>
                </a>

                <a href="documentos_funcionarios.html" class="boton-panel pos-3">
                    <span>Cargar Documentación</span>
                </a>

                <a href="documentos_funcionarios.html#documentos-grabados" class="boton-panel pos-4">
                    <span>Ver Documentación</span>
                </a>

                <a href="encuesta.html" class="boton-panel pos-5">
                    <span>Encuesta de Funcionarios</span>
                </a>
            </div>

            <div class="contenedor-cerrar">
                <a href="../index.html" class="btn-cerrar-sesion">Cerrar Sesión</a>
            </div>
        </section>
    </main>

    <footer>
        <p>Hospital de Clínicas - Sistema Interno de Gestión</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var usuarioGuardado = localStorage.getItem('usuario') || localStorage.getItem('nombre');
            if (usuarioGuardado) {
                document.getElementById('nombre-usuario').textContent = usuarioGuardado;
            }
        });
    </script>
</body>
</html>
