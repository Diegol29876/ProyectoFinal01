<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Funcionarios - Hospital de Clínicas</title>
    <link rel="stylesheet" href="../css/panel_fun.css">
</head>
<body>

<header class="encabezado-panel">
    <div class="logo-panel">
        <img src="../img/Logo_Hc_small.png" alt="Logo Hospital de Clínicas">
    </div>

    <div class="titulo-panel">
        <h1>Hospital de Clínicas</h1>
        <h2>Panel de Funcionarios</h2>
    </div>

    <div class="perfil-header">
        <div class="perfil-texto">
            <strong>Diego Gonzalez</strong>
            <span>Funcionario administrativo</span>
        </div>
    </div>
</header>

<main>
    <section class="panel-principal">
        <h2>Panel principal</h2>
        <div class="botones-panel">
            <a href="#ambulancias" class="boton-panel">
                <img src="../img/Icono Documento.png" alt="Ambulancias">
                <span>Ambulancias</span>
            </a>
            <a href="#documentacion" class="boton-panel">
                <img src="../img/Icono Documento.png" alt="Documentación">
                <span>Documentación</span>
            </a>
            <a href="#encuestas" class="boton-panel">
                <img src="../img/Icono  Encuesta.png" alt="Encuestas">
                <span>Encuestas</span>
            </a>
            <a href="registro.html" class="boton-panel">
                <img src="../img/Icono Informacion.png" alt="Funcionarios">
                <span>Funcionarios</span>
            </a>
            <a href="#reportes" class="boton-panel">
                <img src="../img/Ruedita de configuarcion.png" alt="Reportes">
                <span>Reportes</span>
            </a>
        </div>
    </section>
</main>

<footer>
    <p>Hospital de Clínicas - Sistema de gestión para funcionarios</p>
</footer>
</body>
</html>
