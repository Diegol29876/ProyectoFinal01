<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="../css/registro.css">

</head>
<body>

    <header>
        <div class="logo">
            <img src="../Logo_Hc_small.png" alt="Logo Hospital de Clínicas">
        </div>
        
        <a href="../index.html" class="btn-login">Volver al inicio</a>
    </header>

    <main>
        <div class="contenedor-login">

            <div class="bienvenida">
                <h2>Crear Cuenta</h2>
                <p>Ingresá tus datos para continuar</p>
            </div>

            <form class="formulario">
                <label>Nombre de usuario</label>
                <input type="text" placeholder="Ingresá tu usuario">
                
                <label>Correo electrónico</label>
                <input type="email" placeholder="Ingresá tu correo electrónico">

                <lablel>Nuemro de teléfono</label>
                <input type="tel" placeholder="Ingresá tu número de teléfono">

                <label>Contraseña</label>
                <input type="password" placeholder="Ingresá tu contraseña">

                <button type="submit">Iniciar sesión</button>
            </form>

        </div>
    </main>

    <footer>
        <strong>Tu información está protegida</strong>
        <p>Sitio desarollado por GIT Stack</p>
    </footer>

</body>
</html>
