<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Hospital de Clínicas</title>
    <link rel="stylesheet" href="../css/registro.css?v=3">
    <link rel="stylesheet" href="../css/boton_panel.css?v=20261007">
    <link rel="stylesheet" href="../css/footer.css?v=20261007">
</head>
<body>

    <header class="encabezado-panel">
        <div class="logo">
            <img src="../img/Logo_Hc_small.png" alt="Logo Hospital de Clínicas">
        </div>
        <a href="panel_fun.html" class="boton-volver-panel">Volver al Panel</a>
    </header>

    <main>
        <div class="contenedor-login">
            <div class="bienvenida">
                <h2>Registrar Funcionario</h2>
                <p>Ingresá los datos correspondientes para dar de alta la cuenta</p>
            </div>

            <form class="formulario" id="form-registro" autocomplete="off">
                <label for="n_usuario">Nombre de usuario</label>
                <input type="text" placeholder="Ingresá el usuario" id="n_usuario" name="n_usuario" autocomplete="off" required>

                <label for="contrasenia">Contraseña</label>
                <input type="password" placeholder="Ingresá la contraseña" id="contrasenia" name="contrasenia" autocomplete="new-password" required>

                <label for="c_electronico">Correo electrónico</label>
                <input type="email" placeholder="correo@hospitalclinicas.uy" id="c_electronico" name="c_electronico" autocomplete="off" required>

                <label for="direccion">Dirección</label>
                <input type="text" placeholder="Ingresá la dirección" id="direccion" name="direccion" autocomplete="off" required>

                <label for="f_nacimiento">Fecha de nacimiento</label>
                <input type="date" id="f_nacimiento" name="f_nacimiento" autocomplete="off" required>

                <label for="cedula">Cédula</label>
                <input type="text" id="cedula" name="cedula" maxlength="8" inputmode="numeric" pattern="[0-9]*" placeholder="Sin puntos ni guiones" autocomplete="off" required>

                <label for="n_telefono">Número de teléfono</label>
                <input type="tel" placeholder="099123456" id="n_telefono" name="n_telefono" autocomplete="off" required>

                <label for="f_ingreso">Fecha de Ingreso</label>
                <input type="date" id="f_ingreso" name="f_ingreso" autocomplete="off" required>

                <label for="estado">Estado</label>
                <select id="estado" name="estado" autocomplete="off" required>
                    <option value="" selected disabled>Seleccioná un estado</option>
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>

                <button type="submit">Registrar usuario</button>
            </form>
        </div>
    </main>

    <footer class="footer-site">
        <strong>Tu información está protegida</strong>
        <p>Sitio desarrollado por GID Stack</p>
    </footer>

    <script src="../js/registro.js"></script>
</body>
</html>
