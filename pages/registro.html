<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="../css/registro.css">

</head>
<body>

    <header>
        <div class="logo">
            <img src="../img/Logo_Hc_small.png" alt="Logo Hospital de Clínicas">
        </div>
    </header>

    <main>
        <div class="contenedor-login">

            <div class="bienvenida">
                <h2>Crear Cuenta</h2>
                <p>Ingresá tus datos para continuar</p>
            </div>

            <form class="formulario" id="form-registro">
                <label for="n_usuario">Nombre de usuario</label>
                <input type="text" placeholder="Ingresá tu usuario" id="n_usuario" name="n_usuario" required>

                <label for="c_electronico">Correo electrónico</label>
                <input type="email" placeholder="Ingresá tu correo electrónico" id="c_electronico" name="c_electronico" required>

                <label for="n_telefono">Número de teléfono</label>
                <input type="tel" placeholder="Ingresá tu número de teléfono" id="n_telefono" name="n_telefono" required>

                <label for="contraseña">Contraseña</label>
                <input type="password" placeholder="Ingresá tu contraseña" id="contraseña" name="contraseña" required>

                <label for="direccion">Dirección</label>
                <input type="text" placeholder="Ingresá tu dirección" id="direccion" name="direccion" required>

                <label for="f_nacimiento">Fecha de nacimiento</label>
                <input type="date" placeholder="Ingresá tu fecha de nacimiento" id="f_nacimiento" name="f_nacimiento" required>

                <label for="cedula">Cédula</label>
                <input type="text" id="cedula" name="cedula" maxlength="8" inputmode="numeric" pattern="[0-9]*" placeholder="Ingresá tu Cédula" required>

                <label for="estado">Estado</label>
                <input type="text" placeholder="Ingresá tu estado" id="estado" name="estado" required>

                <label for="f_ingreso">Fecha de Ingreso</label>
                <input type="date" placeholder="Ingresá tu fecha de ingreso" id="f_ingreso" name="f_ingreso" required>

                <button type="submit">Iniciar sesión</button>
            </form>
            <script src="../js/registro.js"></script>

        </div>
    </main>

    <footer>
        <strong>Tu información está protegida</strong>
        <p>Sitio desarollado por GIT Stack</p>
    </footer>

</body>
</html>
